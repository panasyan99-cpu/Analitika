name: Analitika CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Verify dependencies
        run: |
          python -m pip check
          python -m streamlit version
      - name: Compile
        run: python -m compileall -q .
      - name: Verify UI action registry
        run: python scripts/ui_action_inventory.py
      - name: Tests and Streamlit AppTest
        env:
          ORDER_STORAGE_REQUIRED: "false"
        run: pytest -q
