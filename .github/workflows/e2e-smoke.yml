name: Analitika browser smoke

on:
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run safe deployed-site smoke test
        env:
          ANALITIKA_BASE_URL: ${{ secrets.ANALITIKA_BASE_URL }}
          ANALITIKA_PASSWORD: ${{ secrets.ANALITIKA_PASSWORD }}
        run: python scripts/e2e_smoke.py
