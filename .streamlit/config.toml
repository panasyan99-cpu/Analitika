[theme]
primaryColor = "#B7893F"
backgroundColor = "#F8F6F2"
secondaryBackgroundColor = "#FFFDF9"
textColor = "#171411"
font = "sans serif"

[server]
maxUploadSize = 150
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

# Reduce background work in the long-running Community Cloud process.
[runner]
fastReruns = true


[client]
toolbarMode = "minimal"
